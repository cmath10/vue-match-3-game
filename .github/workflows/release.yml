name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install browser
        run: yarn playwright:install --with-deps

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test:playwright

      - name: Build
        run: yarn build

      - name: Generate release tag
        id: release_tag
        run: echo "tag=$(node scripts/release-tag.mjs)" >> "$GITHUB_OUTPUT"

      - name: Check release tag
        run: |
          if git rev-parse --verify --quiet "refs/tags/${{ steps.release_tag.outputs.tag }}"; then
            echo "Tag ${{ steps.release_tag.outputs.tag }} already exists"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.release_tag.outputs.tag }}" -m "${{ steps.release_tag.outputs.tag }}"
          git push origin "${{ steps.release_tag.outputs.tag }}"
