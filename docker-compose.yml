version: "3.2"
services:
  node:
    image: vue-match-3-game-node
    environment:
      UID: ${uid}
      GID: ${gid}
      PORT_VUE: ${port_vue}
    ports:
      - "${port_vue}:8080"
    volumes:
      - type: bind
        source: .
        target: /var/www/vue-match-3-game
      - type: bind
        source: "$SSH_AUTH_SOCK"
        target: /ssh-auth.sock
